<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Records en el game over -->
        <div id="records-panel" class="records-panel hidden">
          <form id="record-form" class="record-form hidden">
            <p id="record-msg" class="record-msg"></p>
            <div class="record-form-row">
              <input id="record-name" type="text" maxlength="12" value="JUGADOR"
                autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
              <button type="submit" id="record-save">Guardar</button>
            </div>
          </form>
          <div id="gameover-records" class="records-table-wrap"></div>
          <p id="gameover-game-stats" class="records-stats"></p>
          <p id="gameover-stats" class="records-stats"></p>
          <button type="button" class="clear-records-btn">Borrar records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio -->
    <div id="start-screen" class="overlay start-screen hidden">
      <div class="overlay-box">
        <p class="start-title">MEJORES PUNTUACIONES</p>
        <div id="start-records" class="records-table-wrap"></div>
        <p id="start-stats" class="records-stats"></p>
        <button type="button" id="play-btn">Jugar</button>
        <p class="start-hint">o pulsa <kbd>Enter</kbd></p>
        <button type="button" class="clear-records-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
